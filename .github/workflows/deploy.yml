name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CI: lint + type-aware build on every push / pull request ──
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves DATABASE_URL even for `prisma generate`;
      # no real connection is made during CI.
      DATABASE_URL: mysql://root:ci-dummy@127.0.0.1:3306/rcc_hiros
      JWT_SECRET: ci-build-only
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build (includes TypeScript type-check)
        run: npm run build

  # ── CD: rebuild + restart the stack on the on-prem server PC ──
  # Runs on a self-hosted Windows runner registered on the machine that
  # hosts Docker Desktop, MariaDB data, and the ZK9500 kiosk scanner.
  # The runner polls GitHub (outbound only) — no inbound ports required.
  deploy:
    name: Deploy to on-prem server
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Apply migrations and start stack
        run: docker compose up -d

      - name: Wait for app to become healthy
        run: |
          $ok = $false
          for ($i = 0; $i -lt 36; $i++) {
            try {
              $r = Invoke-WebRequest -Uri http://localhost:3000 -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            Write-Error "App did not become healthy within 3 minutes."
            docker compose logs app
            exit 1
          }
          Write-Host "Deployment healthy at http://localhost:3000"

      - name: Deployment summary
        run: |
          Write-Host "Deployed commit: $env:GITHUB_SHA"
          Write-Host "Public URL is provided by cloudflared (run scripts\start-tunnel.bat on this machine if the tunnel is not running)."
        env:
          GITHUB_SHA: ${{ github.sha }}
